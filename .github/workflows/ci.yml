name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: blaksync-self-hosted
  cancel-in-progress: false

jobs:
  check:
    name: JavaScript and Python checks
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test Syncthing REST wrapper
        run: npm test

      - name: Test organisation overlay
        run: python3 -m unittest discover -s tests -v

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
