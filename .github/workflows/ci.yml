name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: blaksync-self-hosted
  cancel-in-progress: false

jobs:
  check:
    name: Lint, typecheck, build
    runs-on: [self-hosted]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test Syncthing REST wrapper
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
