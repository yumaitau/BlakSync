name: E2E nightly

# End-to-end suites run here only, never in push or pull-request CI.
on:
  schedule:
    - cron: '0 15 * * *' # 02:00 AEDT
  workflow_dispatch:

permissions:
  contents: read

# Shares CI's group so jobs on the self-hosted runner never overlap.
concurrency:
  group: blaksync-self-hosted
  cancel-in-progress: false

jobs:
  e2e:
    name: Two-device pair and share
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.85.0

      - name: Two isolated Syncthing homes
        run: bash scripts/e2e-two-device.sh
