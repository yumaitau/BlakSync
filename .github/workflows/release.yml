# Tag vX.Y.Z. Runs on the GitHub-hosted ubuntu-24.04-arm runner (public repository).
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: blaksync-release
  cancel-in-progress: false

jobs:
  package:
    name: Package signed artefacts
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.85.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Build artefacts
        run: bash scripts/package-release.sh

      - name: Optional codesign
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          WINDOWS_PFX: ${{ secrets.WINDOWS_PFX }}
        run: |
          set -euo pipefail
          echo "Platform signing tools are not installed on this runner."
          echo "Linux artefact is the tarball plus SHA256SUMS."
          if [[ -n "${WINDOWS_PFX:-}" ]]; then
            echo "Windows Authenticode secret is present."
          fi
          if [[ -n "${MACOS_SIGN_IDENTITY:-}" ]]; then
            echo "macOS notarisation identity is present."
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" dist-release/*.tar.gz dist-release/SHA256SUMS \
            --title "${GITHUB_REF_NAME}" \
            --notes "See CHANGELOG.md. Verify SHA256SUMS before install."
