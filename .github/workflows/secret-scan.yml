# Secret scan on self-hosted runners only.
# Gitleaks runs locally on the runner. The repo is not uploaded to a SaaS scanner.
name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: blaksync-secret-scan-self-hosted
  cancel-in-progress: false

jobs:
  secret-scan:
    name: Gitleaks and dummy-key check
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.85.0

      - name: Equivalent scan (no download)
        run: cargo run --locked --quiet --bin blaksync-secret-scan -- --source .

      - name: Dummy key in a test repo must fail
        run: bash scripts/assert-dummy-key-fails.sh

      - name: Install gitleaks (pinned checksum, runner-local)
        run: |
          set -euo pipefail
          VERSION=8.30.1
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64|amd64)
              ASSET="gitleaks_${VERSION}_linux_x64.tar.gz"
              SHA="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
              ;;
            aarch64|arm64)
              ASSET="gitleaks_${VERSION}_linux_arm64.tar.gz"
              SHA="e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080"
              ;;
            *)
              echo "unsupported architecture: $ARCH" >&2
              exit 1
              ;;
          esac
          curl -sSfL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${ASSET}"
          echo "${SHA}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          chmod +x /tmp/gitleaks
          /tmp/gitleaks version

      - name: Gitleaks (git history, redacted)
        run: |
          set -euo pipefail
          # `detect` remains the documented alias in gitleaks 8.30 for a git scan.
          /tmp/gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --verbose \
            --redact \
            --no-banner \
            --exit-code 1

      - name: Dummy key.pem must fail gitleaks
        env:
          GITLEAKS_BIN: /tmp/gitleaks
        run: bash scripts/assert-dummy-key-fails.sh
