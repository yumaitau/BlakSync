[package]
name = "blaksync"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
default-run = "blaksync"
license = "Apache-2.0"
description = "Local-first peer-to-peer folder sync for Australian Indigenous organisations"

[lib]
path = "backend/lib.rs"

[[bin]]
name = "blaksync"
path = "backend/main.rs"

[[bin]]
name = "blaksync-secret-scan"
path = "backend/secret_scan_main.rs"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.6", features = ["derive"] }
csv = "1"
dirs = "6"
fs2 = "0.4.3"
percent-encoding = "2"
regex = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal"] }
tower-http = { version = "0.7.0", features = ["fs"] }
tempfile = "3"
walkdir = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
strip = true
lto = "thin"
